<!doctype html>
<html><head><meta charset="utf-8"><title>Gaji Habis Tanggal 20</title>
<style>@font-face{font-family:Jost;src:url(fonts/Jost.ttf) format('truetype');font-weight:100 900}
html,body{margin:0;background:#F3F0EA;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
const cv = document.getElementById('c'), g = cv.getContext('2d');
for (const w of [400, 500, 600, 700]) await document.fonts.load(`${w} 40px Jost`);
const film = await import('./film.js'); const Q = new URLSearchParams(location.search);
await film.load(g);
window.DUR = film.DUR(); window.EV = film.events();
window.render = t => film.render(t, Q);
window.TEXTS = t => film.render(t, Q, true);
window.READY = true;
</script></body></html>
